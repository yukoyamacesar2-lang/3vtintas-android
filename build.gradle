plugins {
    alias(libs.plugins.android.application) apply false
    alias(libs.plugins.android.library) apply false
    alias(libs.plugins.spotbugs) apply false
}

// Dependency freshness is enforced by the repository dependency-audit gate.
// Android Lint's network-backed version detector is intentionally disabled so
// cached reports cannot make the same immutable source pass or fail depending
// on repository metadata observed by a runner.
subprojects {
    pluginManager.withPlugin("com.android.application") {
        android.lint.disable += [
            "NewerVersionAvailable",
            "AndroidGradlePluginVersion",
            "GradleDependency"
        ]
    }
    pluginManager.withPlugin("com.android.library") {
        android.lint.disable += [
            "NewerVersionAvailable",
            "AndroidGradlePluginVersion",
            "GradleDependency"
        ]
    }
}

