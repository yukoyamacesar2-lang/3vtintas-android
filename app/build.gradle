def debugJavaClasses = layout.buildDirectory.dir(
        "intermediates/javac/debug/compileDebugJavaWithJavac/classes")

def jacocoDebugUnitTestReport = tasks.register(
        "jacocoDebugUnitTestReport",
        JacocoReport) {
    group = "verification"
    description = "Generates coverage for debug JVM unit tests."
    dependsOn(tasks.named("testDebugUnitTest"))

    sourceDirectories.from(files("src/main/java"))
    classDirectories.from(debugJavaClasses.map { directory ->
        fileTree(directory) {
            exclude(
                    '**/BuildConfig.*',
                    '**/R.class',
                    '**/R$*.class',
                    '**/*Binding.*')
        }
    })
    executionData.from(layout.buildDirectory.file("jacoco/testDebugUnitTest.exec"))

    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

tasks.named("check") {
    dependsOn(jacocoDebugUnitTestReport)
}
