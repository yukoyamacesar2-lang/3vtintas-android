def applicationVersionCode = providers.gradleProperty("appVersionCode")
        .map { value -> value.toInteger() }
        .orElse(70)
def registeredAppVersionMaximum = 32
def longestBuildTypeVersionSuffix = "-workforce"
def applicationVersionName = providers.gradleProperty("appVersionName")
        .orElse("0.59.0-tint-quotes")
        .map { value ->
            if ((value + longestBuildTypeVersionSuffix).length()
                    > registeredAppVersionMaximum) {
                throw new GradleException(
                        "The decorated app version exceeds the 32-character mobile session contract.")
            }
            value
        }
def configuredMobileApiBaseUrl = providers.gradleProperty("mobileApiBaseUrl")
def fallbackMobileApiBaseUrl = "https://api.3vtintas.invalid/api/mobile/v1/"
def mobileApiBaseUrl = configuredMobileApiBaseUrl.orElse(fallbackMobileApiBaseUrl)
def mobileContractVersion = providers.gradleProperty("mobileContractVersion")
        .orElse("0.53.0")
def firebaseApplicationId = providers.gradleProperty("firebaseApplicationId").orElse("")
def firebaseProjectId = providers.gradleProperty("firebaseProjectId").orElse("")
def firebaseApiKey = providers.gradleProperty("firebaseApiKey").orElse("")
def firebaseSenderId = providers.gradleProperty("firebaseSenderId").orElse("")
def firebaseConfigured = providers.provider {
    !firebaseApplicationId.get().isBlank()
            && !firebaseProjectId.get().isBlank()
            && !firebaseApiKey.get().isBlank()
            && !firebaseSenderId.get().isBlank()
}
def configuredAndroidTestBuildType = providers.gradleProperty("androidTestBuildType")
        .orElse("debug")

android {
    namespace = "br.com.tresvtintas.mobile.app"
    compileSdk = libs.versions.compileSdk.get().toInteger()
    buildToolsVersion = libs.versions.buildTools.get()
    testBuildType = configuredAndroidTestBuildType.get()

    if (configuredAndroidTestBuildType.get() == "staging") {
        sourceSets {
            androidTest {
                java.setSrcDirs(["src/physicalPilotAndroidTest/java"])
                manifest.srcFile("src/androidTest/AndroidManifest.xml")
            }
        }
    }

    defaultConfig {
        applicationId = "br.com.tresvtintas.app"
        minSdk = libs.versions.minSdk.get().toInteger()
        targetSdk = libs.versions.targetSdk.get().toInteger()
        versionCode = applicationVersionCode.get()
        versionName = applicationVersionName.get()

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField("String", "ENVIRONMENT", "\"production\"")
        buildConfigField("String", "MOBILE_API_BASE_URL", "\"${mobileApiBaseUrl.get()}\"")
        buildConfigField(
                "String",
                "MOBILE_CONTRACT_VERSION",
                "\"${mobileContractVersion.get()}\"")
        buildConfigField(
                "boolean",
                "MOBILE_API_CONFIGURED",
                configuredMobileApiBaseUrl.isPresent().toString())
        buildConfigField("boolean", "IS_WORKFORCE", "false")
        buildConfigField("String", "FIREBASE_APPLICATION_ID", "\"${firebaseApplicationId.get()}\"")
        buildConfigField("String", "FIREBASE_PROJECT_ID", "\"${firebaseProjectId.get()}\"")
        buildConfigField("String", "FIREBASE_API_KEY", "\"${firebaseApiKey.get()}\"")
        buildConfigField("String", "FIREBASE_SENDER_ID", "\"${firebaseSenderId.get()}\"")
        buildConfigField(
                "boolean",
                "FIREBASE_CONFIGURED",
                firebaseConfigured.get().toString())
    }

    buildTypes {
        debug {
            applicationIdSuffix = ".debug"
            versionNameSuffix = "-debug"
            buildConfigField("String", "ENVIRONMENT", "\"development\"")
        }
        staging {
            initWith(debug)
            applicationIdSuffix = ".staging"
            versionNameSuffix = "-staging"
            matchingFallbacks = ["debug"]
            buildConfigField("String", "ENVIRONMENT", "\"staging\"")
        }
        workforceStaging {
            initWith(staging)
            applicationIdSuffix = ".workforce.staging"
            versionNameSuffix = "-workforce"
            matchingFallbacks = ["staging", "debug"]
            buildConfigField("String", "ENVIRONMENT", "\"private-workforce\"")
            buildConfigField("boolean", "IS_WORKFORCE", "true")
        }
        workforceRelease {
            initWith(release)
            applicationIdSuffix = ".workforce"
            versionNameSuffix = "-workforce"
            matchingFallbacks = ["release"]
            buildConfigField("String", "ENVIRONMENT", "\"production-workforce\"")
            buildConfigField("boolean", "IS_WORKFORCE", "true")
        }
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles(
                    getDefaultProguardFile("proguard-android-optimize.txt"),
                    "proguard-rules.pro")
        }
    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    lint {
        abortOnError = true
        checkReleaseBuilds = true
        warningsAsErrors = true
        htmlReport = true
        xmlReport = true
        sarifReport = true
    }

    packaging {
        resources {
            excludes += [
                    "META-INF/AL2.0",
                    "META-INF/LGPL2.1",
                    "META-INF/LICENSE.md",
                    "META-INF/NOTICE.md"
            ]
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

def allowProductionBackendForStaging = providers.gradleProperty(
        "allowProductionBackendForStaging")
        .map { value -> value.trim().equalsIgnoreCase("true") }
        .orElse(false)
def mobileApiPointsToProduction = { String value ->
    try {
        def host = new URI(value).host?.toLowerCase(Locale.ROOT)
        host == "3vtintas.com.br" || host?.endsWith(".3vtintas.com.br")
    } catch (Exception ignored) {
        false
    }
}

tasks.configureEach { task ->
    if (task.name.toLowerCase(Locale.ROOT).contains("staging")) {
        task.doFirst {
            if (configuredMobileApiBaseUrl.isPresent()
                    && mobileApiPointsToProduction(mobileApiBaseUrl.get())
                    && !allowProductionBackendForStaging.get()) {
                throw new GradleException(
                        "Staging Android builds cannot target 3vtintas.com.br. "
                                + "Use an isolated non-production API, or explicitly set "
                                + "-PallowProductionBackendForStaging=true for an approved "
                                + "controlled production test.")
            }
        }
    }
}

